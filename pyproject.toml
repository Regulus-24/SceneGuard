[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneguard"
version = "0.1.0"
description = "Deterministic GLB quality gate core for the SceneGuard AgentTeams project."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["Pillow==11.3.0"]

[project.scripts]
sceneguard = "sceneguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
